version: '3.8'

services:
  # -----------------------
  # MongoDB Database
  # -----------------------
  mongodb:
    image: mongo:7.0
    container_name: mongodb_container
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app_network

  # -----------------------
  # Python Application
  # (your Flask-MQTT / SocketIO server)
  # -----------------------
  python_app:
    build: .
    container_name: python_app_container
    depends_on:
      - mongodb
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: admin
      MONGO_PASSWORD: password123
      MQTT_HOST: 0.0.0.0              # <-- MQTT broker runs in python_app
    ports:
      - "5000:5000"
      - "1883:1883"                   # <-- Expose MQTT broker
    networks:
      - app_network

  # -----------------------
  # Temperature Transmitter (Raspberry Pi)
  # -----------------------
  mqtt_transmitter:
    build: ./transmitter            # folder containing Dockerfile + transmitter.py
    container_name: temperature_transmitter
    restart: always
    privileged: true                 # REQUIRED for GPIO
    devices:
      - "/dev/gpiomem:/dev/gpiomem"  # GPIO access
    depends_on:
      - python_app
    environment:
      MQTT_BROKER: python_app        # publish directly to backend container
      MQTT_PORT: 1883
    networks:
      - app_network

# -----------------------
# Networks
# -----------------------
networks:
  app_network:
    driver: bridge

# -----------------------
# Volumes
# -----------------------
volumes:
  mongodb_data:
