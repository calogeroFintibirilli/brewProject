version: '3.8'

services:
  # -----------------------
  # MongoDB Database
  # -----------------------
  mongodb:
    image: mongo:7.0
    container_name: mongodb_container
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app_network

  # -----------------------
  # MQTT Broker (Mosquitto)
  # -----------------------
  mqtt_broker:
    image: eclipse-mosquitto:2
    container_name: mosquitto_broker
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - app_network

  # -----------------------
  # Python Application
  # Flask + Flask-MQTT + SocketIO
  # -----------------------
  python_app:
    build: .
    container_name: python_app_container
    network_mode: "host"
    depends_on:
      - mongodb
      - mqtt_broker
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: admin
      MONGO_PASSWORD: password123

      MQTT_BROKER_URL: 192.168.1.57   
      MQTT_BROKER_PORT: 1883
    ports:
      - "5000:5000"

  # -----------------------
  # Temperature Transmitter (Raspberry Pi)
  # -----------------------
  mqtt_transmitter:
    build: ./transmitter
    container_name: temperature_transmitter
    restart: always
    privileged: true
    devices:
      - "/dev/gpiomem:/dev/gpiomem"
    depends_on:
      - mqtt_broker                   # Wait until Mosquitto is up
    environment:
      MQTT_BROKER: mqtt_broker       # Publish to Mosquitto
      MQTT_PORT: 1883
    networks:
      - app_network

# -----------------------
# Networks
# -----------------------
networks:
  app_network:
    driver: bridge

# -----------------------
# Volumes
# -----------------------
volumes:
  mongodb_data:
